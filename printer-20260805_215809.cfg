# This file contains common pin mappings for the LDO Voron 2.4 Rev. D kit
# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON 2.4 250/300/350mm Leviathan V1.1 + Nitehawk-SB config

[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include nozzle_scrub.cfg]
[include config_backup.cfg]
[include leds.cfg]

[pause_resume]

[exclude_object]

[idle_timeout]
timeout: 3600

[force_move]
enable_force_move: True

#[firmware_retraction]
#retract_length: 0.8
#etract_speed: 35
#unretract_extra_length: 0.05
#unretract_speed: 35

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_42002D000251333236353439-if00
restart_method: command

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
serial: /dev/serial/by-id/usb-Klipper_rp2040_323232323619672F-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 350  
max_accel: 6000
max_z_velocity: 90          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: 0
position_endstop: 352
position_max: 352
homing_speed: 55   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PD5
diag_pin: ^PD6
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 125

##  A Stepper - Right

[stepper_y]
step_pin: PC12
dir_pin: !PC11
enable_pin: !PD2
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 200 for 1.8 degree stepper
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -11
position_endstop: 347
position_max: 347
homing_speed: 55  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD0
diag_pin: ^PD1
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 125


#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left

[stepper_z]
step_pin: PB10
dir_pin: !PB11
enable_pin: !PG0
rotation_distance: 40
gear_ratio: 80:16  
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 330
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc5160 stepper_z]
cs_pin: PE15
spi_bus: spi4
#diag_pin: ^!PD6
interpolate: true
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
driver_TOFF: 4
driver_HSTRT: 0
driver_HEND: 7
driver_TBL: 1
driver_MULTISTEP_FILT: True

##  Z1 Stepper - Rear Left

[stepper_z1]
step_pin: PF15
dir_pin: PF14
enable_pin: !PE9
rotation_distance: 40
gear_ratio: 80:16 
microsteps: 16

[tmc5160 stepper_z1]
cs_pin: PE11
spi_bus: spi4
#diag_pin: ^!PD1
interpolate: true
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
driver_TOFF: 4
driver_HSTRT: 0
driver_HEND: 7
driver_TBL: 1
driver_MULTISTEP_FILT: True

##  Z2 Stepper - Rear Right

[stepper_z2]
step_pin: PD15
dir_pin: !PD14
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16 
microsteps: 16

[tmc5160 stepper_z2]
cs_pin: PB12
#spi_bus: spi2
#diag_pin: ^!PA15
interpolate: true
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
driver_TOFF: 4
driver_HSTRT: 0
driver_HEND: 7
driver_TBL: 1
driver_MULTISTEP_FILT: True

##  Z3 Stepper - Front Right

[stepper_z3]
step_pin: PG4
dir_pin: PE8
enable_pin: !PB0
rotation_distance: 40
gear_ratio: 80:16 
microsteps: 16

[tmc5160 stepper_z3]
cs_pin: PG5
#spi_bus: spi2
#diag_pin: ^!PC6
interpolate: true
run_current: 1.0
sense_resistor: 0.075
stealthchop_threshold: 0
driver_TOFF: 4
driver_HSTRT: 0
driver_HEND: 7
driver_TBL: 1
driver_MULTISTEP_FILT: True

#####################################################################
#   Extruder
#####################################################################

##  Connected to STEPPER 0
##  Heater - HEATER
##  Thermistor - TH0
[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
# rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
# gear_ratio: 50:10               #BMG Gear Ratio
rotation_distance: 51.75
gear_ratio: 11.25:1
max_extrude_only_distance: 250.0
microsteps: 32
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk:gpio9
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:gpio29
pullup_resistor: 2200
min_temp: 10
max_temp: 300
max_power: 1
min_extrude_temp: 170
max_extrude_cross_section: 5
pressure_advance: 0.045
pressure_advance_smooth_time: 0.04

[tmc2209 extruder]
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 0


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  SSR Pin - HEATBED
##  Thermistor - TH1
heater_pin: PG11
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA2
pullup_resistor: 2200
max_power: 0.85  ##  Rule of thumb is 0.4 watts / cm^2 .
min_temp: 0
max_temp: 120


#####################################################################
#  Probe
#####################################################################

[probe]
pin: nhk:gpio10  
x_offset: 0
y_offset: 0 
#z_offset: 0       #Placeholder
#z_offset: 0.026750       #Based on 50-probe run; this constitutes "zero", and then we can adjust base on print start logic
speed: 5.0
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = printer.extruder.temperature + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% if MAX_TEMP > PROBE_TEMP %}
##         {action_respond_info("Extruder temperature %.1c is too high, waiting for it to cool to %.1c" % (ACTUAL_TEMP, PROBE_TEMP))}
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={PROBE_TEMP}
    {% endif %}

[bed_mesh]
speed: 350
horizontal_move_z: 5
mesh_min: 30,30
mesh_max: 320,320   
probe_count: 11,11
algorithm: bicubic
fade_start: 0.5
fade_end: 3.0
zero_reference_position: 175, 175

#####################################################################
#   Fan Control
#####################################################################

[fan]
##  Print Cooling Fan - FAN0
pin: nhk:gpio6
max_power: 1.0
kick_start_time: 0.2
## tachometer_pin: PB0

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: nhk:gpio5
# tachometer_pin: nhk:gpio16
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
#fan_speed: 1.0

[controller_fan controller_fan]
##  Controller fan - FAN2
pin: PF7
# tachometer_pin: PF6
kick_start_time: 0.5
heater: heater_bed

[heater_fan exhaust_fan]
##  Exhaust fan - FAN3
pin: PF9
#tachometer_pin: PF8
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 45
fan_speed: 1.0

#####################################################################
#   Buzzer
#####################################################################

[pwm_cycle_time _beeper]
## Passive Buzzer - varying cycle time varies the pitch
pin: PB1
shutdown_value: 0
value: 0

#####################################################################
#   Filament sensor
#####################################################################

# [filament_switch_sensor Filament]
# pause_on_runout: True
# runout_gcode: M600
# insert_gcode:
# event_delay: 3.0
# pause_delay: 0.5
# switch_pin: nhk:gpio3

#####################################################################
#   Non-Neopixel Light Control
#####################################################################

[output_pin caselight]
pin: PE6
pwm:true
hardware_pwm: False
value: 0.20 #startup value
shutdown_value: 0
value:1
cycle_time: 0.00025

[output_pin pcb_led]
pin: !nhk:gpio8

#####################################################################
#   Accelerometer
#####################################################################
[adxl345]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
probe_points:
    175, 175, 20

##--------------------------------------------------------------------

#####################################################################
#   TH
# #####################################################################
[temperature_sensor chamber_temp]
## Chamber Temperature - T1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA3
pullup_resistor: 2200
min_temp: 0
max_temp: 100
gcode_id: chamber_th

[thermistor CMFB103F3950FANT]
temperature1: 0.0
resistance1: 32116.0
temperature2: 40.0
resistance2: 5309.0
temperature3: 80.0
resistance3: 1228.0

[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100


#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[safe_z_home]
home_xy_position: 175, 175
#   A X, Y coordinate (e.g. 100, 100) where the Z homing should be
#   performed. This parameter must be provided.
speed: 200.0
#   Speed at which the toolhead is moved to the safe Z home
#   coordinate. The default is 50 mm/s
z_hop: 10.0
#   Distance (in mm) to lift the Z axis prior to homing. This is
#   applied to any homing command, even if it doesn't home the Z axis.
#   If the Z axis is already homed and the current Z position is less
#   than z_hop, then this will lift the head to a height of z_hop. If
#   the Z axis is not already homed the head is lifted by z_hop.
#   The default is to not implement Z hop.

[quad_gantry_level]

gantry_corners:
   -60,-10
   410,420
##  Probe points
points:
   25,25
   25,320
   325,320
   325,25
speed: 350
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#####################################################################
#   Macros
#####################################################################

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    STATUS_HOMING
    G90
    G28
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    G28
    G0 X175 Y175 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32
   
[gcode_macro PRINT_START]
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(200)|float %}
    {% set CHAMBER = params.CHAMBER|default(0)|float %}
    {% set OFFSET = params.OFFSET|default(0)|float %}
        
    BED_MESH_CLEAR
    exclude_object_define
    G90
    
    RESPOND MSG="Heating bed"
    STATUS_HEATING
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED}
    M109 S140
    G4 P20000
    
    STATUS_HOMING
    
    CHOME
    CLEAN_NOZZLE

   # SET_GCODE_OFFSET Z=0 ABSOLUTE=1

    STATUS_LEVELING

    RESPOND MSG="Leveling"
    G28 Z 
    QUAD_GANTRY_LEVEL 

    RESPOND MSG="Setting Z Offset"

    STATUS_CALIBRATING_Z
    
   # M109 S200
   CLEAN_NOZZLE
   # G1 E-5 F3600
    G28 Z
   # SET_GCODE_OFFSET Z_ADJUST={OFFSET} MOVE=1 ABSOLUTE=1

    SMART_PARK

    RESPOND MSG="Loading mesh"
   # BED_MESH_PROFILE LOAD=default
    BED_MESH_PROFILE LOAD=110_mesh
    STATUS_HEATING

    M109 S{EXTRUDER} 
    
    RESPOND MSG="Let's Go!"

    STATUS_PRINTING
    
    LINE_PURGE
    G1 Z10 F3000                   
   

[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    STATUS_PART_READY
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-12.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 20} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    #SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
    
   # SET_GCODE_OFFSET Z=0 ABSOLUTE=1
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro _NEBULA_VARIABLE]
# unload
variable_unload_purge_distance: 35   # (mm) purge a distance before unload to clean filament
variable_unload_purge_speed:    300  # (mm/min) purge speed
variable_unload_distance:       150  # (mm) unload distance
variable_unload_speed:          3000 # (mm/min) unload speed
# load
variable_load_distance:         40   # (mm) load distance
variable_load_speed:            1500 # (mm/min) load speed
variable_load_purge_distance:   160  # (mm) purge a distance after load
variable_load_purge_speed:      300  # (mm/min) purge speed
variable_load_temp:             240  # (temp fpr loading)
gcode:

[gcode_macro NEBULA_UNLOAD_FILAMENT]
gcode:
  {% set nebula = printer['gcode_macro _NEBULA_VARIABLE'] %}
  {% set unload_purge_distance = nebula.unload_purge_distance %}
  {% set unload_purge_speed = nebula.unload_purge_speed %}
  {% set unload_distance = nebula.unload_distance %}
  {% set unload_speed = nebula.unload_speed %}

  SAVE_GCODE_STATE NAME=tmp_unload_state
  G91
  G92 E0
  M118 Nebula unload purging
  G1 E{unload_purge_distance} F{unload_purge_speed}
  M400
  M118 Nebula unloading
  G1 E-{unload_distance} F{unload_speed}
  M400
  RESTORE_GCODE_STATE NAME=tmp_unload_state

[gcode_macro NEBULA_LOAD_FILAMENT]
gcode:
  {% set nebula = printer['gcode_macro _NEBULA_VARIABLE'] %}
  {% set load_purge_distance = nebula.load_purge_distance %}
  {% set load_purge_speed = nebula.load_purge_speed %}
  {% set load_distance = nebula.load_distance %}
  {% set load_speed = nebula.load_speed %}
  {% set load_temp = nebula.load_temp %}

  SAVE_GCODE_STATE NAME=tmp_unload_state
  G91
  G92 E0
  STATUS_HEATING
  M109 S{load_temp} 
  STATUS_PRINTING
  M118 Nebula loading
  G1 E{load_distance} F{load_speed}
  M400
  M118 Nebula load purging
  G1 E{load_purge_distance} F{load_purge_speed}
  M400
  STATUS_PART_READY
  RESTORE_GCODE_STATE NAME=tmp_unload_state

[gcode_button nebula_unload_button]
pin: nhk:gpio13 # Gcode Button pin（marked as GB on extruder）, Modify this to match your mainboard！
debounce_delay: 0.02
press_gcode:
release_gcode:
  {% if printer.print_stats.state != "printing" %}
    {% set fs = printer['gcode_button filament_sensor'] %}
    {% if fs.state == "RELEASED" %}
      NEBULA_UNLOAD_FILAMENT
    {% endif %}
  {% endif %}

[gcode_button filament_sensor]
pin: nhk:gpio3  # Filament sensor pin（marked as FS on extruder）, Modify this to match your mainboard！
debounce_delay: 0.5
press_gcode:
  {% if printer.print_stats.state == "printing" %}
    PAUSE # [pause_resume] is required in printer.cfg
  {% endif %}
release_gcode:
  {% if printer.print_stats.state != "printing" %}
    LOAD_FILAMENT
  {% endif %}

[gcode_macro CHOME]
description: Homes XYZ axis only if printer is in a non-homed state
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
  CHOME
  {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
  {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
  G90
  G1 X{x_center} Y10 F7800

[gcode_macro _WAIT_FOR_CHAMBER]
gcode:
    {% set CHAMBER = params.CHAMBER|default(0)|float %} 
    {% if printer["temperature_sensor chamber_temp"].temperature >= CHAMBER|float %}
        RESPOND MSG={"\"Chamber reached " ~ (CHAMBER|float) ~ "C\""}
    {% else %}
        G4 P1000
        UPDATE_DELAYED_GCODE ID=_WAIT_FOR_CHAMBER_DELAY DURATION=1
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
  {% set CURRENT_TARGET = printer.extruder.target|float %}
  CHOME
  G91                         ; relative positioning
  G1 Z50                      ; move nozzle upwards
  FRONT                       ; move the toolhead to the front
  {% if EXTRUDER_TEMP != 0 %}
    
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
      M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp to reach
  {% endif %}
  
  M83                         ; set extruder to relative mode
  G1 E10 F300                 ; extrude a little to soften tip
  G1 E-8 F3600                ; quickly retract a small amount to elimate stringing
  G4 P200                     ; pause for a short amount of time
  G1 E-60 F400                ; retract slowly the rest of the way
  G1 E-60 F300
  M400                        ; wait for moves to finish
  RESPOND MSG="Filament unload complete!"

  STATUS_PART_READY
  

[gcode_macro LOAD_FILAMENT]
description: Loads new filament into toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
  {% set CURRENT_TARGET = printer.extruder.target|float %}
  {% set nebula = printer['gcode_macro _NEBULA_VARIABLE'] %}
  {% set load_purge_distance = nebula.load_purge_distance %}
  {% set load_purge_speed = nebula.load_purge_speed %}
  {% set load_distance = nebula.load_distance %}
  {% set load_speed = nebula.load_speed %}
  

  SAVE_GCODE_STATE NAME=tmp_unload_state

  G92 E0

  CHOME
  G90
  G1 Z5 F3000
  G1 X315 Y-11 F7800
  
  {% if EXTRUDER_TEMP != 0 %}
    STATUS_HEATING
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
      M104 S{EXTRUDER_TEMP} ; only heat up if the current extruder is not already hot
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP} ; wait for min extrude temp to reach
  {% endif %}

 
  STATUS_PRINTING
  
  M118 Nebula loading
  G1 E{load_distance} F{load_speed}
  M400
  M118 Nebula load purging
  G1 E{load_purge_distance} F{load_purge_speed}
  M400
  RESTORE_GCODE_STATE NAME=tmp_unload_state

  CLEAN_NOZZLE
  M104 S140
  G1 Z50 F3000
  
  RESPOND MSG="Filament load complete!"

  STATUS_PART_READY

## Emits an audible tone, use in conjunction with a passive buzzer to create beeps of different pitch and durations
## Original code from: https://github.com/rootiest/zippy-klipper_config/blob/master/macros/M300.cfg
## Script that converts MIDI files to M300 gcode: https://alexyu132.github.io/midi-m300/
[gcode_macro M300]
gcode:
    {% set S = params.S|default(1000)|int %} ; S sets the tone frequency
    {% set P = params.P|default(100)|int %} ; P sets the tone duration
    {% set L = 0.5 %} ; L varies the PWM on time, close to 0 or 1 the tone gets a bit quieter. 0.5 is a symmetric waveform
    {% if S <= 0 %} ; dont divide through zero
        {% set F = 1 %}
        {% set L = 0 %}
    {% elif S >= 10000 %} ;max frequency set to 10kHz
        {% set F = 0 %}
    {% else %}
        {% set F = 1/S %} ;convert frequency to seconds
    {% endif %}
    SET_PIN PIN=_beeper VALUE={L} CYCLE_TIME={F} ;Play tone
    G4 P{P} ;tone duration
    SET_PIN PIN=_beeper VALUE=0

